<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura objetivo de IndustrialData</title>
<desc id="desc">El simulador produce fuentes originales. El pipeline las integra con el catálogo PostgreSQL, genera capas de datos y publica resultados para el panel. Simulador, catálogo y panel proporcionados. El alumno completa A1–A7 para obtener resultados válidos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#52657b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#162c43}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.blue{fill:#e8f2ff;stroke:#3979b3;stroke-width:2}.amber{fill:#fff3dc;stroke:#b87d1c;stroke-width:2}.gray{fill:#f0f3f6;stroke:#8796a7;stroke-width:2}.line{fill:none;stroke:#52657b;stroke-width:2.5;marker-end:url(#arrow)}</style>
